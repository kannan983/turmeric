<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Turmeric">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC94A"/>
      <stop offset="0.5" stop-color="#F59512"/>
      <stop offset="1" stop-color="#D4470E"/>
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCF3"/>
      <stop offset="1" stop-color="#FFE3AD"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#tile)"/>
  <!-- A key whose bit is a turmeric rhizome: knobbly fingers instead of teeth, a leaf sprouting from the bow. -->
  <g transform="translate(64 64) rotate(-40) translate(-60 -60)">
    <path d="M24 34 C 12 18, 22 4, 40 4 C 42 20, 36 30, 24 34 Z" fill="#43A851"/>
    <path d="M26 31 C 29 22, 33 15, 38 8" stroke="#2C7D3A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <circle cx="36" cy="60" r="27" fill="url(#root)"/>
    <rect x="54" y="52" width="62" height="16" rx="8" fill="url(#root)"/>
    <ellipse cx="82" cy="74" rx="8" ry="12" fill="url(#root)"/>
    <ellipse cx="102" cy="73" rx="7" ry="10" fill="url(#root)"/>
    <ellipse cx="92" cy="47" rx="5.5" ry="7" fill="url(#root)"/>
  </g>
  <!-- Keyhole stays upright; it sits on the bow's centre. -->
  <g transform="translate(64 64) rotate(-40) translate(-60 -60) translate(36 60) rotate(40)">
    <circle cx="0" cy="-5" r="8" fill="#C2410C"/>
    <path d="M-5 -1 L5 -1 L7.5 14 L-7.5 14 Z" fill="#C2410C"/>
  </g>
</svg>
